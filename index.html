edback h3{color:var(--accent)}.feedback.good h3{color:var(--good)}.feedback.bad h3{color:var(--bad)}.choices{display:grid;gap:8px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{min-height:126px;text-align:center;overflow-wrap:anywhere;display:grid;place-items:center}.tile.selected{border:3px solid var(--accent)}.tile.matched{border:2px solid var(--good)}.list{display:grid;gap:10px}.list article{background:var(--panel2);padding:16px;border:1px solid var(--line);border-radius:12px}.list article h3{color:var(--gold)}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.filters>*{flex:1;min-width:150px}.order{display:grid;gap:8px;margin:12px 0}.orderitem{display:flex;align-items:center;gap:8px;background:var(--panel2);padding:10px;border:1px solid var(--line);border-radius:12px}.orderitem span{flex:1}.orderitem button{min-width:48px;text-align:center;padding:.4rem}.notice{padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin:12px 0;color:var(--muted)}footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:.9em}dialog{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(94vw,620px);max-height:90vh;padding:22px}dialog::backdrop{background:#000b}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.spacer{flex:1}.pill{display:inline-block;color:var(--gold);border:1px solid var(--line);border-radius:30px;padding:2px 10px;font-size:.8em}.stack{display:grid;gap:12px}.taglist{display:flex;gap:8px;flex-wrap:wrap}.sign[hidden],[hidden]{display:none!important}@media(max-width:800px){.hero{grid-template-columns:1fr;padding:22px}.hero svg{max-height:190px;order:-1}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.split,.split.expanded{grid-template-columns:1fr}.sign{position:static;grid-row:1;width:100%;display:grid;grid-template-columns:minmax(108px,160px) 1fr;gap:8px;align-items:start}.sign.expanded{grid-template-columns:minmax(160px,260px) 1fr}.sign .frame{grid-column:1;grid-row:1/5;margin:0}.sign .signcontrols{grid-column:2;min-width:0}.sign h2{grid-column:2}.sign button{margin-top:4px}.wrap{padding:0 16px}}@media(max-width:480px){.cards{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.head{gap:6px}.sign.expanded{grid-template-columns:1fr}.sign.expanded .frame{grid-column:1;grid-row:auto;width:min(100%,280px);margin:auto}.sign.expanded h2,.sign.expanded .signcontrols{grid-column:1}.hero{padding:16px}.game{min-height:0}}@media print{header,footer,.sign,button{display:none!important}body{background:white;color:black}.panel{background:white;color:black}}

.own-translator{display:block;font-size:.82em;line-height:1.4;margin-top:12px;text-underline-offset:3px}.translator-nav{display:inline-flex;align-items:center;padding:.4rem .7rem;border:1px solid var(--line);border-radius:10px;color:var(--text);text-decoration:none;font-size:.9em}.translator-nav:focus-visible{outline:3px solid var(--focus);outline-offset:3px}</style></head><body><a class="skip" href="#main">Ir para o conteúdo</a><header><div class="wrap head"><button class="logo" data-go="home" aria-label="FiloSinal, início"><span>✦</span> FiloSinal</button><nav aria-label="Menu principal"><button data-go="home">Início</button><button data-go="games">Jogos</button><button data-go="library">Biblioteca</button><button data-go="glossary">Glossário</button><a class="translator-nav" href="./translator.html">Tradutor</a><a class="translator-nav" href="./videos-libras.html">Vídeos em Libras</a><button data-go="progress">Conquistas</button></nav><div class="toptools"><button data-go="teacher">Modo professor</button><button id="access">Aa · Acessibilidade</button></div></div></header><div class="wrap"><main id="main" tabindex="-1"></main></div><footer><div class="wrap row"><span>✦ FiloSinal · Filosofia sem barreiras</span><span class="spacer"></span><button data-go="about">Sobre e referências</button><button data-go="libras">Libras e acessibilidade</button><a href="./translator.html">FiloSinal Translator · protótipo</a></div></footer><div id="live" class="sr" role="status" aria-live="polite" aria-atomic="true"></div><dialog id="settings" aria-labelledby="settings-title"><h2 id="settings-title">Personalize sua experiência</h2><form id="settings-form"><label>Tema <select id="theme"><option value="dark">Escuro</option><option value="light">Claro</option><option value="contrast">Alto contraste</option></select></label><label><input type="checkbox" id="large"> Aumentar texto</label><label><input type="checkbox" id="relaxed"> Aumentar espaçamento</label><label><input type="checkbox" id="reduce"> Reduzir movimentos</label><label><input type="checkbox" id="simple"> Mostrar apoio de leitura</label><label><input type="checkbox" id="showSign"> Mostrar janela de Libras</label><p class="muted">Todas as atividades são sem cronômetro e sem dependência de áudio.</p><button class="primary" type="submit">Salvar e fechar</button></form></dialog>
<script>
const GAMES=[{id:'duel',name:'Duelo Filosófico',tag:'ARGUMENTAÇÃO',desc:'Interprete problemas e compare argumentos. Questões de nível médio, avançado e especialista.',art:'owl',color:'#35274f'},{id:'cave',name:'Além da Caverna',tag:'AVENTURA',desc:'Oito etapas de investigação inspiradas na alegoria de Platão.',art:'cave',color:'#233c53'},{id:'ethics',name:'Tribunal da Ética',tag:'DILEMAS',desc:'Compare teorias morais em oito dilemas.',art:'scales',color:'#53362e'},{id:'memory',name:'Memória Filosófica',tag:'ASSOCIAÇÃO',desc:'Identifique oito pensadores a partir de suas posições filosóficas.',art:'cards',color:'#32463d'},{id:'timeline',name:'Viagem no Tempo',tag:'HISTÓRIA',desc:'Seis desafios históricos sem datas, com até seis obras por rodada.',art:'portal',color:'#3c2c5c'},{id:'escape',name:'Templo dos Enigmas',tag:'LÓGICA',desc:'Oito portas de lógica: dedução, condições e falácias.',art:'temple',color:'#51412d'}];
const Q=(id,topic,level,prompt,opts,correct,why,help)=>({id,topic,level,prompt,opts,correct,why,help});
const QUESTIONS=[
Q('q01','Conhecimento','Avançado','Uma pessoa acredita que o relógio marca 8h porque o vê parado nesse horário. Por coincidência, são exatamente 8h. O caso desafia principalmente qual ideia?', ['Que toda crença verdadeira e aparentemente justificada constitui conhecimento.','Que toda observação é falsa.','Que o tempo só existe na imaginação.','Que a verdade depende de votação.'],0,'A coincidência mostra que uma crença verdadeira pode resultar de sorte. É um problema semelhante aos casos de Gettier: verdade e justificação podem não bastar para conhecimento.','Pense na diferença entre acertar por sorte e saber por boas razões.'),
Q('q02','Conhecimento','Médio','Uma pesquisadora muda sua hipótese quando encontra evidências incompatíveis. Qual atitude se aproxima da investigação crítica de Karl Popper?',['Coletar apenas exemplos que confirmem a hipótese.','Expor a hipótese a possíveis refutações.','Considerar qualquer hipótese igualmente científica.','Transformar a hipótese em certeza absoluta.'],1,'Para Popper, teorias científicas precisam admitir testes que possam contradizê-las. Resistir a testes não equivale a provar uma teoria definitivamente.','Uma teoria precisa poder ser colocada à prova.'),
Q('q03','Conhecimento','Avançado','Descartes decide duvidar até das crenças que recebeu pelos sentidos. Qual é o papel dessa dúvida no seu método?',['Concluir que nada pode ser conhecido.','Defender que só a tradição garante a verdade.','Investigar se existe uma certeza que resista à dúvida.','Demonstrar que razão e experiência nunca se relacionam.'],2,'A dúvida cartesiana é metódica: serve para procurar um fundamento seguro. O ato de pensar enquanto se duvida conduz ao cogito.','A dúvida é um meio de investigação, não necessariamente a conclusão.'),
Q('q04','Ética','Avançado','Uma empresa usa dados pessoais sem consentimento e afirma que a prática beneficia a maioria dos clientes. Qual objeção é mais compatível com a filosofia moral de Kant?',['O lucro nunca pode existir.','As ações são corretas sempre que beneficiam a maioria.','A moral depende apenas da tradição local.','Pessoas não devem ser tratadas meramente como meios para alcançar um benefício.'],3,'A fórmula da humanidade exige respeitar pessoas como fins em si mesmas. Benefícios coletivos não eliminam a necessidade de respeitar autonomia e dignidade.','Diferencie o resultado da ação do respeito às pessoas.'),
Q('q05','Ética','Médio','Alguém devolve um dinheiro encontrado somente para aparecer em um vídeo e receber elogios. Qual distinção Kant faria?', ['Agir conforme o dever não é necessariamente agir por dever.','Qualquer ação que siga uma regra tem o mesmo valor moral.','A ação deixa de existir se houver testemunhas.','O valor moral é medido apenas pela quantidade de elogios.'],0,'Kant distingue a conformidade externa ao dever da ação motivada pelo próprio dever. Uma ação correta pode ter uma motivação moralmente diferente.','Uma ação pode parecer correta, mas qual é sua motivação?'),
Q('q06','Política','Avançado','Uma comissão cria regras de distribuição de bolsas sem saber quem, entre seus integrantes, terá maior ou menor renda. Que conceito de John Rawls esse procedimento exemplifica?',['Vontade de potência.','Véu da ignorância.','Contrato baseado em privilégios hereditários.','Ditadura da maioria.'],1,'O véu da ignorância é um dispositivo hipotético para escolher princípios de justiça sem conhecer a própria posição social, reduzindo escolhas parciais.','Imagine decidir regras sem saber se você será beneficiado ou prejudicado.'),
Q('q07','Política','Avançado','Uma instituição afirma que tratar todos exatamente da mesma maneira é suficiente para promover justiça. Qual exemplo apresenta a crítica mais consistente a essa posição?',['Proibir todos de participar.','Dar vantagens sem qualquer critério.','Oferecer Libras e materiais acessíveis para que estudantes tenham condições efetivas de participação.','Abolir toda regra de convivência.'],2,'Igualdade formal não garante igualdade de oportunidades. Recursos de acessibilidade enfrentam barreiras que atingem pessoas de maneiras distintas.','O mesmo recurso pode não proporcionar as mesmas condições de acesso.'),
Q('q08','Existência','Avançado','Segundo Simone de Beauvoir, a ideia de que não se nasce mulher, torna-se mulher, questiona principalmente o quê?',['A existência de escolhas individuais.','A influência de toda experiência social.','A possibilidade de mudança histórica.','A naturalização dos papéis sociais como destino inevitável.'],3,'Beauvoir examina como relações sociais e históricas produzem expectativas de gênero. A frase não nega a existência do corpo, mas critica seu uso como destino social.','Separe características corporais de papéis construídos pela sociedade.'),
Q('q09','Existência','Médio','Uma estudante afirma: “Não tenho escolha alguma, apenas ajo como esperam de mim”. Na perspectiva de Sartre, o que merece ser questionado?', ['A tentativa de negar a responsabilidade por suas escolhas, mesmo em situações limitadas.','A existência de condições sociais concretas.','A necessidade de considerar outras pessoas.','A possibilidade de tomar decisões.'],0,'Para Sartre, a liberdade é situada: há condições que não escolhemos, mas também responsabilidade pela maneira como respondemos a elas. Negar essa dimensão pode expressar má-fé.','Ter limites não significa que todas as escolhas desaparecem.'),
Q('q10','Política','Médio','Uma instituição usa classificações, avaliações e vigilância constante para levar indivíduos a controlar o próprio comportamento. Qual leitura se aproxima de Michel Foucault?',['O poder só existe na figura de um rei.','O poder também opera por práticas disciplinares e produção de normas.','A vigilância sempre elimina todas as relações de poder.','As instituições são neutras por definição.'],1,'Foucault analisa mecanismos disciplinares que organizam corpos e condutas, inclusive quando as pessoas passam a vigiar a si mesmas.','O poder pode agir pelas regras cotidianas, não só pela força.'),
Q('q11','Ética','Avançado','Ao avaliar uma decisão, uma gestora compara consequências para o bem-estar de todas as pessoas afetadas. Qual princípio aproxima seu raciocínio do utilitarismo?',['Valorizar somente a vantagem pessoal.','Considerar correto tudo que é legal.','Avaliar ações pelas consequências para o bem-estar agregado.','Ignorar o sofrimento se a intenção for boa.'],2,'O utilitarismo considera as consequências para o bem-estar dos afetados. Há debates sobre mensuração, direitos individuais e versões do utilitarismo.','Observe os efeitos da decisão para todos, não só para quem decide.'),
Q('q12','Lógica','Avançado','Dois colegas discordam de uma tese. Um deles responde: “Você é muito jovem, então seu argumento é falso”. Qual é o problema?', ['É uma demonstração por contradição.','É uma conclusão dedutiva válida.','É uma generalização estatística necessária.','É um ataque à pessoa que não avalia a validade do argumento.'],3,'O ad hominem substitui a análise de razões por uma desqualificação pessoal. A idade, isoladamente, não mostra se a tese é verdadeira.','Criticar quem fala não é o mesmo que criticar o argumento.'),
Q('q13','Conhecimento','Avançado','Uma pessoa experimenta repetidamente que dois acontecimentos ocorrem juntos e conclui que um causa necessariamente o outro. Qual crítica se aproxima de David Hume?', ['A experiência mostra regularidades, mas não revela por si só uma conexão necessária.','A razão demonstra todas as causas sem experiência.','A repetição garante logicamente toda previsão futura.','Uma regularidade não pode ser observada.'],0,'Hume problematiza a passagem da observação de regularidades para a necessidade causal. A expectativa resulta do hábito, não de uma demonstração lógica.','Diferencie o que sempre foi observado do que precisa acontecer.'),
Q('q14','Ética','Avançado','Uma estudante quer desenvolver coragem. Em vez de evitar todo risco ou agir impulsivamente, aprende a avaliar situações e agir de forma adequada. Qual ideia de Aristóteles se manifesta?', ['A virtude consiste sempre em dividir uma quantidade ao meio.','A virtude envolve hábitos e deliberação prática sobre a justa medida.','A coragem é a ausência de qualquer medo.','A felicidade depende apenas da riqueza.'],1,'A ética aristotélica entende a virtude como disposição cultivada. O meio adequado depende da situação e da razão prática, não de uma média matemática.','A coragem não é covardia nem imprudência.'),
Q('q15','Política','Avançado','Um projeto educacional reconhece que saberes indígenas são desqualificados quando apenas tradições europeias são tratadas como universais. Qual questão filosófica se destaca?', ['A impossibilidade de diálogo entre culturas.','A ausência de pensamento fora da Europa.','A relação entre poder, reconhecimento e produção de conhecimento.','A necessidade de aceitar qualquer ideia sem crítica.'],2,'A reflexão sobre injustiça epistêmica e colonialidade questiona hierarquias que excluem sujeitos e tradições da produção de conhecimento, sem abolir a avaliação crítica.','Quem é reconhecido como produtor de conhecimento?'),
Q('q16','Estética','Médio','Diante de uma obra, alguém afirma que ela provoca reflexão mesmo sem representar fielmente objetos do mundo. Qual conclusão é mais consistente?', ['Toda arte precisa copiar a natureza.','Só é arte aquilo que é bonito.','Obras abstratas não produzem sentidos.','O valor estético pode envolver interpretação, forma e experiência além da imitação.'],3,'A estética não se reduz à beleza ou à cópia fiel. Diferentes teorias discutem como forma, contexto, experiência e interpretação produzem significados.','Arte pode provocar sentidos mesmo sem retratar objetos reconhecíveis.')];
const ETHICS=[
Q('e01','Ética','Avançado','Um hospital tem recursos limitados. Um gestor propõe priorizar a política que minimiza o sofrimento total. Qual abordagem fundamenta melhor essa proposta?',['Utilitarismo.','Ceticismo radical.','Dualismo cartesiano.','Estética formalista.'],0,'O argumento é consequencialista. Uma discussão completa também precisa considerar direitos, equidade, critérios clínicos e riscos de discriminação.','Observe se o critério está no resultado, no dever ou na virtude.'),
Q('e02','Ética','Avançado','Um colega divulga uma informação falsa para proteger a reputação do grupo. Qual questão seria central em uma análise kantiana?',['Quantas curtidas a postagem terá?','A máxima de mentir por conveniência poderia valer como lei universal?','A mentira tem aparência agradável?','O grupo possui mais membros?'],1,'O imperativo categórico testa se a máxima pode ser universalizada sem contradição. Esta é uma análise da perspectiva kantiana, não uma resposta única a todo dilema.','Teste a regra da ação como se qualquer pessoa pudesse adotá-la.'),
Q('e03','Ética','Avançado','Uma escola mantém uma atividade sem Libras e afirma que ninguém foi excluído porque todos receberam o mesmo material. Qual resposta filosófica problematiza essa justificativa?',['Oferecer menos recursos a todos.','Trocar a atividade por uma prova oral.','Avaliar as condições materiais de participação, e não apenas a igualdade formal.','Desconsiderar a experiência dos estudantes.'],2,'A distribuição idêntica de recursos não garante acesso igual. A justiça exige considerar barreiras e as condições efetivas de participação.','Igualdade de materiais não é sempre igualdade de acesso.'),
Q('e04','Ética','Avançado','Uma amiga pede que você compartilhe uma informação privada de outra pessoa para evitar um conflito no grupo. Que análise combina prudência aristotélica com a complexidade do caso?',['Obedecer sem considerar o contexto.','Escolher sempre o comportamento que traz mais popularidade.','Ignorar todas as responsabilidades.','Deliberar sobre contexto, danos, confiança e formas proporcionais de agir.'],3,'A prudência prática envolve discernimento sobre situações particulares. É possível proteger a confiança e buscar alternativas, sem transformar a virtude em uma regra automática.','Pense em uma atitude proporcional e responsável à situação.')];
const ESCAPE=[Q('l01','Lógica','Avançado','Porta 1: Se uma figura é um quadrado, então tem quatro lados. A figura tem quatro lados. Portanto, é um quadrado. Qual é o diagnóstico?',['A conclusão é inválida: afirmar o consequente.','A conclusão é válida por modus ponens.','A conclusão é válida por modus tollens.','A conclusão é verdadeira por definição.'],0,'Outras figuras têm quatro lados. A forma P implica Q; Q; logo P não é válida.','Um retângulo que não é quadrado também tem quatro lados.'),Q('l02','Lógica','Avançado','Porta 2: Se o código está correto, a porta abre. A porta não abriu. Considerando a premissa verdadeira, o que se segue?',['A porta abriu.','O código não está correto.','O código está correto.','A porta nunca pode abrir.'],1,'A forma P implica Q; não Q; logo não P é o modus tollens, uma inferência válida dadas as premissas.','Se o código correto garantir abertura, uma porta fechada descarta essa condição.'),Q('l03','Lógica','Avançado','Porta 3: Nenhum argumento circular é uma justificação independente. Algumas defesas são argumentos circulares. O que necessariamente se conclui?',['Toda defesa é circular.','Nenhuma defesa é uma justificação independente.','Algumas defesas não são justificações independentes.','Todos os argumentos são defensas.'],2,'A primeira premissa exclui todo argumento circular da classe das justificações independentes. Como algumas defesas são circulares, essas defesas estão fora dessa classe.','A palavra “algumas” não autoriza concluir “todas”.'),Q('l04','Lógica','Avançado','Porta 4: Uma pessoa afirma que só existem duas alternativas: aceitar sua tese integralmente ou abandonar o pensamento racional. Que falácia pode estar presente?',['Apelo à população.','Afirmação do consequente.','Generalização por amostra.','Falso dilema.'],3,'O falso dilema apresenta opções como se fossem exaustivas sem demonstrar que não existem alternativas intermediárias ou diferentes.','É possível discordar de uma parte da tese e continuar pensando racionalmente.')];
const CAVE=[Q('c01','Conhecimento','Médio','Você vive em uma caverna e conhece apenas sombras projetadas na parede. Uma sombra se repete diariamente. O que faria para investigar sua origem?',['Observar padrões e procurar uma maneira de verificar o que produz as sombras.','Declarar que sombras são toda a realidade.','Proibir perguntas sobre a parede.','Concluir que nenhum conhecimento é possível.'],0,'Investigar a origem é um primeiro movimento de questionamento. Na alegoria, as sombras são uma imagem das aparências que tomamos como realidade.','Distinguir aparência de sua causa.'),Q('c02','Conhecimento','Avançado','Você sai da caverna. A luz incomoda, mas aos poucos enxerga objetos. Qual interpretação corresponde melhor ao processo de educação em Platão?',['A aprendizagem é simplesmente acumular informações.','A educação envolve uma reorientação gradual do olhar e do pensamento.','A dor é prova de que a verdade não existe.','A visão física é suficiente para todo conhecimento.'],1,'Na alegoria, a saída expressa um processo de formação: abandonar antigas certezas e dirigir a investigação para o inteligível.','A dificuldade representa uma transformação na compreensão.'),Q('c03','Política','Avançado','Ao voltar, os prisioneiros rejeitam seu relato. Qual questão a cena permite discutir?', ['A impossibilidade definitiva de ensinar.','A superioridade natural de quem discordou.','As tensões entre conhecimento, tradição e responsabilidade política.','A certeza de que toda maioria está errada.'],2,'O retorno problematiza a responsabilidade de quem conhece e a resistência coletiva a mudanças. Não implica que toda opinião majoritária seja falsa.','Considere a relação entre aprender e compartilhar o conhecimento.'),Q('c04','Conhecimento','Avançado','Agora alguém apresenta a alegoria como prova de que toda informação da internet é falsa. Que resposta é mais rigorosa?',['Concordar, pois toda imagem é uma mentira.','Desconsiderar Platão por ser antigo.','Substituir investigação por autoridade.','Usar a alegoria como metáfora para avaliar fontes, sem deduzir que tudo é falso.'],3,'Metáforas filosóficas ajudam a interpretar problemas, mas não provam automaticamente uma generalização empírica. A crítica exige examinar evidências específicas.','Uma metáfora ajuda a pensar; não substitui a investigação.')];

QUESTIONS.push(...[{"id":"q17","topic":"Conhecimento","level":"Especialista","prompt":"Duas teorias incompatíveis explicam todas as observações disponíveis. O que é possível concluir?","opts":["Ambas são verdadeiras, pois explicam os dados.","A primeira proposta merece preferência por ser mais antiga.","Os dados podem ser insuficientes para escolher uma teoria; são necessários outros critérios ou testes.","A evidência empírica não contribui para avaliar teorias."],"correct":2,"why":"A subdeterminação mostra que evidências disponíveis podem ser compatíveis com hipóteses rivais. Isso não torna todas verdadeiras.","help":"Distingua compatibilidade com dados de exclusividade explicativa."},{"id":"q18","topic":"Conhecimento","level":"Especialista","prompt":"Uma testemunha normalmente confiável transmite uma notícia. Existe uma evidência relevante contra a notícia, mas você não a conhece. Qual problema epistemológico se destaca?","opts":["O papel de evidências derrotadoras na justificação de crenças.","A impossibilidade de conhecimento por testemunho.","A superioridade necessária da dedução sobre a indução.","A distinção entre verdades analíticas e sintéticas."],"correct":0,"why":"Uma evidência derrotadora pode enfraquecer a justificação de uma crença, mesmo quando sua fonte costuma ser confiável.","help":"O que pode enfraquecer a razão de acreditar?"},{"id":"q19","topic":"Ética","level":"Especialista","prompt":"Uma pesquisadora prometeu sigilo, mas divulgar dados pode beneficiar a maioria. Qual comparação entre Kant e o utilitarismo de atos é mais precisa?","opts":["Ambos autorizam a quebra de sigilo quando há benefício coletivo.","Kant avalia somente intenções; utilitaristas nunca consideram confiança.","Kant se preocupa só com resultados; utilitaristas só com promessas.","Kant examina deveres e autonomia; o utilitarismo compara consequências, inclusive danos à confiança."],"correct":3,"why":"O contraste é entre critérios deontológicos e consequencialistas. Utilitaristas também podem rejeitar a quebra de sigilo quando os danos superam benefícios.","help":"Compare os critérios, não decisões garantidas."},{"id":"q20","topic":"Política","level":"Especialista","prompt":"Uma política aumenta a renda dos mais pobres, mas restringe liberdades políticas básicas de um grupo. Segundo Rawls, qual avaliação é adequada?","opts":["O princípio da diferença autoriza trocar liberdade por renda.","O ganho econômico não basta para sacrificar liberdades básicas iguais.","A aprovação da maioria resolve o conflito entre princípios.","A distribuição econômica nunca é relevante para a justiça."],"correct":1,"why":"Rawls atribui prioridade às liberdades básicas iguais. O princípio da diferença funciona dentro das exigências anteriores de justiça.","help":"Os princípios têm uma ordem de prioridade."},{"id":"q21","topic":"Existência","level":"Especialista","prompt":"Uma pessoa trata expectativas sociais sobre seu papel como naturais e inevitáveis. Qual comparação entre Beauvoir e Sartre evita simplificações?","opts":["Ambos consideram os papéis sociais uma consequência inevitável da biologia.","Sartre nega toda restrição social; Beauvoir nega toda liberdade.","Ambos questionam a naturalização de papéis; Beauvoir destaca condições concretas de opressão.","Ambos defendem que todas as pessoas possuem as mesmas oportunidades."],"correct":2,"why":"A liberdade existencial é situada. Beauvoir examina como a opressão estrutura possibilidades concretas de existência.","help":"Compare liberdade e condições sociais."},{"id":"q22","topic":"Lógica","level":"Especialista","prompt":"Todo projeto acessível oferece alternativas de comunicação. Este projeto oferece alternativas. Logo, é acessível. Qual avaliação é mais rigorosa?","opts":["Válido porque ambas as premissas são afirmativas.","Inválido: uma condição necessária foi tratada como suficiente.","Válido por modus ponens se a segunda premissa for verdadeira.","Inválido porque acessibilidade não admite raciocínio dedutivo."],"correct":1,"why":"De P implica Q e Q não se conclui necessariamente P: trata-se da afirmação do consequente.","help":"Imagine um projeto com alternativas e outras barreiras."},{"id":"q23","topic":"Política","level":"Especialista","prompt":"Uma estudante surda apresenta um relato pertinente, mas recebe menos credibilidade exclusivamente por preconceito contra sua forma de comunicação. Que conceito melhor descreve o caso?","opts":["Injustiça testemunhal.","Injustiça hermenêutica, necessariamente.","Ceticismo metodológico.","Desacordo racional entre interlocutores."],"correct":0,"why":"Injustiça testemunhal é um déficit de credibilidade provocado por preconceito. Injustiça hermenêutica envolve lacunas estruturais nos recursos coletivos de interpretação.","help":"A barreira está na credibilidade ou nos conceitos disponíveis?"},{"id":"q24","topic":"Estética","level":"Especialista","prompt":"Dois objetos fisicamente idênticos são apresentados como utensílio e como obra de arte. O que o exemplo permite investigar?","opts":["A necessidade de toda arte provocar prazer visual.","Uma propriedade física única que define a arte.","A impossibilidade de qualquer distinção artística racional.","A relevância de contexto, interpretação e práticas artísticas."],"correct":3,"why":"O caso questiona critérios apenas perceptivos e permite discutir abordagens contextuais e institucionais da arte.","help":"A aparência não mudou; o que mudou?"},{"id":"q25","topic":"Conhecimento","level":"Especialista","prompt":"Uma melhora no desempenho ocorre após uma intervenção educativa. Qual conclusão combina a crítica de Hume com investigação causal cuidadosa?","opts":["A ordem temporal prova conexão causal necessária.","A regularidade é evidência relevante, mas explicações alternativas precisam ser examinadas.","A ausência de certeza absoluta torna qualquer hipótese inútil.","A causalidade só pode ser conhecida sem experiência."],"correct":1,"why":"Hume distingue regularidade de conexão necessária. Comparações e controles podem fortalecer inferências sem transformar indução em demonstração lógica.","help":"Diferencie evidência e necessidade lógica."},{"id":"q26","topic":"Ética","level":"Especialista","prompt":"Uma pessoa realiza atos corajosos por instrução, mas não sabe avaliar quando correr riscos é apropriado. O que ainda falta segundo Aristóteles?","opts":["Prudência prática articulada às disposições do caráter.","Uma regra universal que determine o risco exato.","Garantia de maximizar o bem-estar agregado.","Eliminação completa das emoções."],"correct":0,"why":"A phronesis orienta a deliberação nas circunstâncias concretas. Virtude não se reduz a obediência ou repetição mecânica.","help":"Compare hábito e discernimento."},{"id":"q27","topic":"Política","level":"Especialista","prompt":"Uma plataforma classifica estudantes continuamente, levando-os a ajustar a própria conduta. Qual análise foucaultiana é mais consistente?","opts":["Sem punição física não existe poder.","A classificação só reflete capacidades naturais.","Todo poder depende de ordem direta do Estado.","Exames e normas podem produzir condutas e sujeitos, além de reprimir."],"correct":3,"why":"Práticas disciplinares produzem normas e modos de subjetivação. A vigilância pode operar mesmo sem coerção física imediata.","help":"Observe o que a classificação passa a produzir."},{"id":"q28","topic":"Lógica","level":"Especialista","prompt":"Uma pessoa refuta um argumento em favor de uma hipótese e conclui que a hipótese foi demonstrada falsa. Qual distinção foi ignorada?","opts":["Entre premissa e proposição.","Entre sentido literal e figurado.","Entre refutar uma justificativa e demonstrar a falsidade de sua conclusão.","Entre validade formal e notação simbólica."],"correct":2,"why":"Um argumento defeituoso pode ter uma conclusão verdadeira. A hipótese ainda pode ter justificativas independentes.","help":"Separe o argumento da tese."}]);
ETHICS.push(...[{"id":"e05","topic":"Ética","level":"Especialista","prompt":"Uma universidade pode melhorar a média geral ou remover barreiras graves enfrentadas por um grupo menor. Qual questão caracteriza a justiça como equidade, em contraste com uma soma de benefícios?","opts":["Qual programa gera a maior soma, independentemente da distribuição?","Qual programa é mais tradicional?","Como as oportunidades são distribuídas, especialmente entre os menos favorecidos?","Qual programa é administrativamente mais simples?"],"correct":2,"why":"A justiça como equidade considera oportunidades justas e a posição dos menos favorecidos; totais agregados não são seu único critério.","help":"Compare total e distribuição."},{"id":"e06","topic":"Ética","level":"Especialista","prompt":"Uma escola considera monitorar mensagens privadas para reduzir conflitos. Qual análise deontológica é mais rigorosa?","opts":["A intenção de reduzir conflitos basta para justificar o monitoramento.","É necessário avaliar autonomia, deveres e respeito às pessoas, não só o benefício esperado.","Se a maioria concordar, qualquer vigilância é justa.","A redução de incidentes é o único critério moral."],"correct":1,"why":"Deontologia examina deveres e princípios de ação. Benefícios não eliminam automaticamente as exigências de respeito e autonomia.","help":"Examine os limites da ação."},{"id":"e07","topic":"Ética","level":"Especialista","prompt":"Duas políticas produzem benefícios semelhantes. Uma impõe riscos a pessoas que não consentiram; a outra envolve participação voluntária. Qual objeção tensiona uma comparação apenas agregativa?","opts":["Consentimento e distribuição dos riscos podem importar independentemente do total de benefícios.","Não é possível comparar nenhuma consequência.","Participação voluntária torna qualquer política perfeita.","Riscos pequenos não possuem relevância moral."],"correct":0,"why":"Totais semelhantes não implicam equivalência moral. Direitos, consentimento e distribuição po function signHTML(key,title){clipKey=key;return `<aside class="sign ${expanded?'expanded':''}" ${prefs.showSign?'':'hidden'} aria-label="Janela de Libras"><h2>Libras · intérprete</h2><div class="frame" id="video-frame"><div class="placeholder"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="10" width="52" height="44" rx="7" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="32" cy="24" r="7" fill="currentColor"/><path d="M14 46L24 34 32 42 40 34 50 46" stroke="currentColor" fill="none" stroke-width="4"/></svg><strong>Janela 9:16</strong><p>A tradução integral deste conteúdo será exibida quando estiver cadastrada.</p></div></div><div class="signcontrols"><small>${esc(title)}</small><button id="expand" aria-pressed="${expanded}">${expanded?'Reduzir janela':'Ampliar janela'}</button><button id="replay" hidden>Reproduzir novamente</button><small id="clipstatus" role="status"></small><a class="own-translator" href="./translator.html#${encodeURIComponent(key)}" target="_blank" rel="noopener noreferrer">FiloSinal Translator · Consultar tradução (nova aba)</a></div></aside>`}
function viewWithSign(html,key,title){return `<div class="split ${expanded?'expanded':''}"><section>${html}</section>${signHTML(key,title)}</div>`}
function loadClip(){const token=++clipToken,key=clipKey,frame=$('#video-frame');if(!frame||!prefs.showSign||!/^[a-z0-9][a-z0-9-]{0,100}$/i.test(key))return;const src=Object.prototype.hasOwnProperty.call(PUBLISHED_VIDEOS,key)?PUBLISHED_VIDEOS[key]:'videos/'+encodeURIComponent(key)+'.mp4';if(!src)return;const v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='metadata';v.hidden=true;v.setAttribute('aria-label','Vídeo de interpretação em Libras');frame.append(v);v.addEventListener('loadedmetadata',()=>{if(token!==clipToken||!frame.isConnected)return;frame.replaceChildren(v);v.hidden=false;$('#replay').hidden=false;$('#clipstatus').textContent='Vídeo em Libras disponível.'});v.addEventListener('error',()=>{if(token===clipToken&&frame.isConnected){v.remove();$('#replay').hidden=true;$('#clipstatus').textContent='Tradução em vídeo indisponível no momento.'}});v.src=src}
function bindClip(){if(!$('#video-frame'))return;loadClip();$('#expand').onclick=()=>{expanded=!expanded;$('.split').classList.toggle('expanded',expanded);$('.sign').classList.toggle('expanded',expanded);$('#expand').textContent=expanded?'Reduzir janela':'Ampliar janela';$('#expand').setAttribute('aria-pressed',expanded)};$('#replay').onclick=()=>{const v=$('#video-frame video');if(v){v.currentTime=0;v.play().catch(()=>{})}};}
function go(p){if(session&&page==='play'&&p!=='play'&&!session.complete){if(!confirm('Sair desta partida? O progresso desta partida ainda não foi salvo.'))return;session=null}page=p;render();}document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go);const start=e.target.closest('[data-start]');if(start)startGame(start.dataset.start);const detail=e.target.closest('[data-detail]');if(detail){page=detail.dataset.detail;render()}});
$('#access').onclick=()=>{for(const k of ['theme','large','relaxed','reduce','simple','showSign']){const x=$('#'+k);if(x.type==='checkbox')x.checked=!!prefs[k];else x.value=prefs[k]}$('#settings').showModal()};$('#settings-form').onsubmit=e=>{e.preventDefault();for(const k of ['theme','large','relaxed','reduce','simple','showSign']){const x=$('#'+k);prefs[k]=x.type==='checkbox'?x.checked:x.value}save('fs2-prefs',prefs);applyPrefs();$('#settings').close();if(!prefs.showSign&&$('.sign'))$('.sign').hidden=true;else if($('.sign'))$('.sign').hidden=false;if(page==='play'&&session&&['duel','ethics','escape','cave','teacher'].includes(session.kind)&&!session.complete)render(false);announce('Preferências salvas')};
function gameCards(){return `<div class="cards">${GAMES.map(g=>`<button class="game" data-start="${g.id}"><div class="art" style="--art:${g.color}">${art(g.art)}</div><div class="body"><span class="tag">${g.tag}</span><h3>${g.name}</h3><p>${g.desc}</p><span class="play">Jogar →</span></div></button>`).join('')}</div>`}function dashboard(){return `<div class="stats"><div class="stat"><small>Experiência</small><strong>${stats.xp} XP</strong></div><div class="stat"><small>Nível</small><strong>${1+Math.floor(stats.xp/500)}</strong></div><div class="stat"><small>Partidas concluídas</small><strong>${stats.history.length}</strong></div></div>`}
function home(){return `<section class="hero"><div><p class="eyebrow">Filosofia • jogos • acessibilidade</p><h1>O pensamento é livre.<br>O conhecimento também.</h1><p class="muted">Questione certezas, explore novas ideias e aprenda no seu ritmo. Uma plataforma de Filosofia pensada para a diversidade linguística e a inclusão.</p><div class="row"><button class="primary" data-go="games">Explorar jogos →</button><button data-go="libras">Libras e acessibilidade</button></div></div>${art('temple')}</section>${dashboard()}<div class="sectionhead"><h2>Escolha sua jornada</h2><span class="muted">6 experiências · sem cronômetro</span></div>${gameCards()}<div class="sectionhead"><h2>Conhecimento em movimento</h2></div><div class="panel"><p>Aprenda com pensadores de diferentes épocas e tradições; consulte o glossário sempre que precisar.</p><div class="row"><button data-go="library">Biblioteca de filósofos</button><button data-go="glossary">Glossário de conceitos</button></div></div>`}
function startGame(id,items=null){const g=GAMES.find(x=>x.id===id);if(id==='duel'){page='setup';session=null;render();return}if(['ethics','cave','escape','teacher'].includes(id)){session={kind:id,name:g?.name||'Partida do professor',items:items||({ethics:shuffle(ETHICS),cave:CAVE,escape:ESCAPE}[id]),i:0,chosen:null,score:0,answers:[],complete:false}}else if(id==='memory'){const people=shuffle(PEOPLE).slice(0,8);const cards=shuffle(people.flatMap(p=>[{key:p[0],text:p[1],type:'Pensador'},{key:p[0],text:p[4],type:'Ideia'}]));session={kind:id,name:g.name,cards,pairs:people.length,missed:[],selected:[],matched:[],attempts:0,complete:false}}else if(id==='timeline'){session={kind:id,name:g.name,i:0,rounds:shuffle(TIMELINES),order:[],checked:false,score:0,complete:false};session.order=mixedOrder(session.rounds[0].items.map(x=>x[1]))}else return;page='play';render()}
function questionsSetup(){return `<h1>Duelo Filosófico</h1><p class="muted">Escolha o conteúdo e o nível. A dificuldade não altera o tempo de leitura: não há cronômetro.</p>${viewWithSign(`<form class="panel stack" id="quiz-setup"><label>Tema <select id="topic"><option value="all">Todos os temas</option>${[...new Set(QUESTIONS.map(q=>q.topic))].map(t=>`<option>${t}</option>`).join('')}</select></label><label>Dificuldade <select id="level"><option>Especialista</option><option>Avançado</option><option>Médio</option><option value="all">Todos os níveis</option></select></label><button class="primary">Iniciar desafio</button><p id="setup-msg" role="status"></p></form>`,'duel-instrucoes','Instruções do Duelo Filosófico')}`}
function bindSetup(){const f=$('#quiz-setup');if(!f)return;f.onsubmit=e=>{e.preventDefault();const t=$('#topic').value,l=$('#level').value,items=shuffle(QUESTIONS.filter(q=>(t==='all'||q.topic===t)&&(l==='all'||q.level===l))).slice(0,12);if(!items.length){$('#setup-msg').textContent='Não há perguntas nesta combinação. Selecione outra opção.';return}session={kind:'duel',name:'Duelo Filosófico',items,i:0,chosen:null,score:0,answers:[],complete:false};page='play';render()}}
function gameTop(current,total){return `<div class="row"><button data-go="games">← Jogos</button><span class="spacer"></span><span class="pill">Sem cronômetro</span></div><h1>${esc(session.name)}</h1><p class="muted">${current} de ${total}</p><div class="progress" role="progressbar" aria-label="Progresso" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${current}"><span style="width:${100*current/total}%"></span></div>`}
function quiz(){const s=session,q=s.items[s.i],answered=s.chosen!==null;const retryPrompt=s.kind==='escape'&&!answered&&s.retrying;let options=q.opts.map((_,i)=>i);const run=s.answers.slice(0,s.i).reverse().findIndex(a=>!a?.correct),streak=run<0?s.i:run;const stage=s.kind==='cave'?['Sombras','A saída','O retorno','Metáforas e investigação','Hipóteses rivais','Aprender e compreender','Poder e representação','Autocrítica'][s.i]:s.kind==='escape'?'Porta '+(s.i+1)+' de '+s.items.length:'';return gameTop(s.i+1,s.items.length)+viewWithSign(`<div class="panel"><div class="taglist"><span class="pill">${esc(q.topic)}</span><span class="pill">${esc(q.level)}</span><span class="pill">Acertos de primeira: ${s.score}</span><span class="pill">Sequência anterior: ${streak}</span></div>${stage?`<p class="eyebrow" style="margin-top:12px">${esc(stage)}</p>`:''}${['cave','escape'].includes(s.kind)?`<div class="art" style="background:#26233d;border-radius:12px;margin:10px 0;display:grid;place-items:center">${art(s.kind==='cave'?'cave':'temple')}</div>`:''}<h2 style="margin-top:15px" id="question">${esc(q.prompt)}</h2>${prefs.simple?`<details><summary>Consultar pista opcional</summary><p>${esc(q.help)}</p></details>`:''}<div class="answers" role="group" aria-labelledby="question">${options.map((i,n)=>`<button class="answer ${answered&&i===q.correct?'correct':answered&&i===s.chosen?'wrong':''}" data-answer="${i}" ${answered||(retryPrompt&&s.failedChoice===i)?'disabled':''}><span class="letter">${'ABCD'[n]}.</span><span>${esc(q.opts[i])}${answered&&i===q.correct?' <strong>✓ Correta</strong>':answered&&i===s.chosen?' <strong>✗ Sua escolha</strong>':''}</span></button>`).join('')}</div>${answered?`<div class="feedback ${s.chosen===q.correct?'good':'bad'}" id="feedback" tabindex="-1"><h3>${s.chosen===q.correct?'✓ Resposta correta':'✗ Vamos refletir'}</h3><p>${esc(q.why)}</p>${s.kind==='escape'&&s.chosen!==q.correct?'<p>Revise a solução antes de seguir para a próxima porta.</p>':''}</div>${`<button class="primary" id="next">${s.i===s.items.length-1?'Ver resultado':'Continuar →'}</button>`}`:retryPrompt?'<div class="notice" id="logic-retry" tabindex="-1">A primeira tentativa não abriu a porta. Revise as premissas e tente outra alternativa. O acerto nesta tentativa não conta como acerto de primeira.</div>':'<p class="muted">Escolha a alternativa mais consistente com a perspectiva apresentada.</p>'}</div>`,`${q.id}-${answered?'explicacao':'pergunta'}`,answered?'Explicação da resposta':'Pergunta e alternativas')}
function bindQuiz(){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(session.chosen!==null)return;const q=session.items[session.i];session.chosen=Number(b.dataset.answer);const ok=session.chosen===q.correct;if(session.kind==='escape'&&!ok&&!session.retrying){session.failedChoice=session.chosen;session.chosen=null;session.retrying=true;render(false);$('#logic-retry').focus();announce('Tente outra alternativa.');return}if(ok&&!session.retrying)session.score++;session.answers[session.i]={id:q.id,topic:q.topic,correct:ok&&!session.retrying};render(false);$('#feedback').focus();announce(ok?'Resposta correta.':'Resposta incorreta. Leia a explicação.');});if($('#retry'))$('#retry').onclick=()=>{session.chosen=null;session.retrying=true;render(false);$('#question').setAttribute('tabindex','-1');$('#question').focus()};if($('#next'))$('#next').onclick=()=>{if(session.i+1===session.items.length)finish(session.score,session.items.length);else{session.i++;session.chosen=null;session.retrying=false;session.failedChoice=null;session.optionOrder=null;render();}}}
function memory(){const s=session;return gameTop(s.matched.length/2,s.pairs)+viewWithSign(`<div class="panel"><h2>Associe pensador e ideia</h2><p>Associe cada pensador à descrição de sua posição filosófica. As cartas ficam visíveis; consulte Libras sem responder.</p><p class="muted">Tentativas: ${s.attempts} · Pares: ${s.matched.length/2}/${s.pairs} · Erros: ${s.attempts-s.matched.length/2}</p><label for="memoryclip">Consultar uma carta em Libras sem responder</label><select id="memoryclip"><option value="">Instruções</option>${s.cards.map((c,i)=>`<option value="${i}" ${s.preview===c?'selected':''}>${esc(c.type+': '+c.text)}</option>`).join('')}</select><div class="tiles">${s.cards.map((c,i)=>`<button class="tile ${s.selected.includes(i)?'selected':''} ${s.matched.includes(i)?'matched':''}" aria-pressed="${s.selected.includes(i)}" ${s.matched.includes(i)?'disabled':''} data-card="${i}"><span><small>${c.type}</small><br><strong>${esc(c.text)}</strong>${s.matched.includes(i)?'<br>✓ Par encontrado':''}</span></button>`).join('')}</div>${s.selected.length===2?`<div class="feedback" id="memfeedback" tabindex="-1"><p>${s.cards[s.selected[0]].key===s.cards[s.selected[1]].key?'✓ Associação correta!':'As duas cartas não formam um par. Experimente outra associação.'}</p><button id="memcontinue" class="primary">Continuar</button></div>`:''}</div>`,(s.preview?'memory-'+s.preview.key+'-'+(s.preview.type==='Pensador'?'nome':'caso'):'memory-instrucoes'),s.preview?'Carta: '+s.preview.text:'Instruções do jogo de associação')}
function bindMemory(){$('#memoryclip').onchange=e=>{session.preview=e.target.value===''?null:session.cards[Number(e.target.value)];render(false);$('#memoryclip').focus()};document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{const s=session,i=Number(b.dataset.card);if(s.selected.length===2)return;if(s.selected[0]===i){s.selected=[];render(false);$(`[data-card="${i}"]`).focus();return}if(s.selected.length&&s.cards[s.selected[0]].type===s.cards[i].type){s.selected=[i];render(false);$(`[data-card="${i}"]`).focus();return}s.selected.push(i);if(s.selected.length===2){s.attempts++;if(s.cards[s.selected[0]].key===s.cards[i].key)s.matched.push(...s.selected);else for(const j of s.selected){const k=s.cards[j].key;if(!s.missed.includes(k))s.missed.push(k)}render(false);$('#memfeedback').focus()}else{render(false);$(`[data-card="${i}"]`).focus()}});if($('#memcontinue'))$('#memcontinue').onclick=()=>{if(session.matched.length===session.pairs*2)finish(session.pairs-session.missed.length,session.pairs);else{session.selected=[];render(false);document.querySelector('[data-card]:not(:disabled)')?.focus()}}}
function timeline(){const s=session,r=s.rounds[s.i];return gameTop(s.i+1,s.rounds.length)+viewWithSign(`<div class="panel"><h2>${esc(r.name)}</h2><p>Organize do mais antigo ao mais recente. Use os botões subir e descer; não é necessário arrastar.</p><div class="order">${s.order.map((id,i)=>`<div class="orderitem"><span><strong>${i+1}.</strong> ${esc(r.items.find(a=>a[1]===id)[0])}</span><button data-move="${i},-1" aria-label="Subir item ${i+1}" ${i===0||s.checked?'disabled':''}>↑</button><button data-move="${i},1" aria-label="Descer item ${i+1}" ${i===s.order.length-1||s.checked?'disabled':''}>↓</button></div>`).join('')}</div>${s.checked?`<div class="feedback" tabindex="-1" id="timefeedback"><h3>${s.order.every((v,i)=>v===r.items[i][1])?'✓ Ordem correta':'Confira a ordem correta'}</h3><ol>${r.items.map(a=>`<li>${esc(a[0])}</li>`).join('')}</ol><p>${esc(r.why)}</p></div><button class="primary" id="time-next">${s.i+1===s.rounds.length?'Ver resultado':'Próximo desafio'}</button>`:'<button class="primary" id="time-check">Verificar ordem</button>'}</div>`,`${r.id}-${s.checked?'explicacao':'pergunta'}`,s.checked?'Explicação da ordem':'Desafio cronológico')}
function bindTimeline(){document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const [i,d]=b.dataset.move.split(',').map(Number),a=session.order;[a[i],a[i+d]]=[a[i+d],a[i]];render(false);const target=$(`[data-move="${i+d},${d}"]`);if(target&&!target.disabled)target.focus();else $(`[data-move="${i+d},${-d}"]`)?.focus();announce('Item movido para a posição '+(i+d+1))});if($('#time-check'))$('#time-check').onclick=()=>{if(session.order.every((v,i)=>v===session.rounds[session.i].items[i][1]))session.score++;session.checked=true;render(false);$('#timefeedback').focus()};if($('#time-next'))$('#time-next').onclick=()=>{if(session.i+1===session.rounds.length)finish(session.score,session.rounds.length);else{session.i++;session.order=mixedOrder(session.rounds[session.i].items.map(a=>a[1]));session.checked=false;render()}}}
function finish(score,total){if(session.complete)return;session.complete=true;session.result={score,total,xp:50+score*100};stats.xp+=session.result.xp;stats.history.unshift({name:session.name,kind:session.kind,date:new Date().toISOString(),score,total,xp:session.result.xp,answers:session.answers?.filter(Boolean)||[]});save('fs2-stats',stats);render();announce('Partida concluída. '+score+' de '+total)}function result(){let r=session.result;const review=(session.answers||[]).filter(a=>!a.correct).map(a=>session.items?.find(q=>q.id===a.id)).filter(Boolean);return viewWithSign(`<div class="panel"><p class="eyebrow">Jornada concluída</p><h1>Continue questionando!</h1><h2>${r.score} de ${r.total} · +${r.xp} XP</h2><p>${session.kind==='memory'?'Você encontrou todos os pares. O placar conta os pares que não foram envolvidos em associações incorretas.': 'Seu resultado indica acertos nesta partida, não mede todo o seu conhecimento.'}</p>${review.length?`<details><summary>Revisar ${review.length} questão(ões) sem acerto de primeira</summary><div class="list">${review.map(q=>`<article><h3>${esc(q.topic)}</h3><p>${esc(q.prompt)}</p><p><strong>Resposta:</strong> ${esc(q.opts[q.correct])}</p><p>${esc(q.why)}</p></article>`).join('')}</div></details>`:''}<div class="row"><button data-go="games" class="primary">Escolher outro jogo</button><button data-go="progress">Ver conquistas</button></div></div>`,'resultado','Mensagem de conclusão')}
function normalize(x){return x.toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function library(){return `<h1>Biblioteca de filósofos</h1><p class="muted">Pensadores, contextos e ideias para aprofundar as partidas.</p><label>Buscar por nome ou conceito<input id="search" placeholder="Ex.: Kant, justiça, ética"></label><div id="collection" class="list"></div>`}function glossary(){return `<h1>Glossário filosófico</h1><p class="muted">Conceitos explicados com exemplos. Cada termo tem um espaço próprio para Libras.</p><label>Buscar termo<input id="search" placeholder="Ex.: ética"></label><div id="collection" class="list"></div>`}function bindCollection(kind){const update=()=>{const term=normalize($('#search').value);const arr=(kind==='library'?PEOPLE:TERMS).filter(a=>normalize(a.slice(1).join(' ')).includes(term));$('#collection').innerHTML=arr.length?arr.map(a=>`<article><h3>${esc(a[1])}</h3><p class="muted">${esc(a[2])} · ${esc(a[3])}</p><button data-detail="${kind==='library'?'person':'term'}:${a[0]}">Explorar ${esc(a[1])}</button></article>`).join(''):'<p>Nenhum resultado. Tente outro termo.</p>';announce(arr.length+' resultados')};$('#search').oninput=update;update()}function detailsPage(){const [kind,id]=page.split(':'),p=(kind==='person'?PEOPLE:TERMS).find(x=>x[0]===id);if(!p)return '<h1>Conteúdo não encontrado</h1>';return `<button data-go="${kind==='person'?'library':'glossary'}">← Voltar</button>`+viewWithSign(`<div class="panel"><p class="eyebrow">${esc(p[2])}</p><h1>${esc(p[1])}</h1>${kind==='person'?`<h2>${esc(p[3])}</h2><p>${esc(p[4])}</p><h3>Leitura sugerida</h3><p>${esc(p[5])}</p>`:`<p>${esc(p[3])}</p><h2>Exemplo</h2><p>${esc(p[4])}</p>`}</div>`,`${kind}-${id}`,p[1])}
const BADGES=[['Primeira jornada','Concluir uma partida','✦',s=>s.history.length>=1],['Mente curiosa','Concluir cinco partidas','◇',s=>s.history.length>=5],['Explorador','Experimentar todos os seis jogos','⌁',s=>GAMES.every(g=>s.history.some(h=>h.kind===g.id))],['Guardião da ética','Concluir o Tribunal da Ética','⚖',s=>s.history.some(h=>h.kind==='ethics')],['Pensamento crítico','Acertar 20 questões de primeira','◎',s=>s.history.flatMap(h=>h.answers||[]).filter(a=>a.correct).length>=20],['Sabedoria','Alcançar 2.000 XP','★',s=>s.xp>=2000]];function progressPage(){return `<h1>Suas conquistas</h1>${dashboard()}<div class="cards">${BADGES.map(([name,desc,ico,fn])=>`<article class="panel"><span style="font-size:2em;color:var(--gold)" aria-hidden="true">${ico}</span><h3>${name}</h3><p>${desc}</p><small>${fn(stats)?'✓ Desbloqueada':'Ainda não conquistada'}</small></article>`).join('')}</div><div class="sectionhead"><h2>Histórico</h2><button id="csv">Exportar CSV</button></div><div class="list">${stats.history.length?stats.history.map(h=>`<article><h3>${esc(h.name)}</h3><p>${h.score}/${h.total} · ${h.xp} XP · ${new Date(h.date).toLocaleDateString('pt-BR')}</p></article>`).join(''):'<p>Nenhuma partida concluída.</p>'}</div>`}function download(name,data,type='text/plain'){const u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function csv(){const cell=x=>'"'+String(x).replace(/^([=+\-@])/,'\'\u200b$1').replaceAll('"','""')+'"';download('filosinal-resultados.csv','\ufeff'+[['Data','Jogo','Acertos','Total','XP','Assunto','Acerto por questão'],...stats.history.flatMap(h=>h.answers?.length?h.answers.map(a=>[h.date,h.name,h.score,h.total,h.xp,a.topic,a.correct?'Sim':'Não']):[[h.date,h.name,h.score,h.total,h.xp,'','']])].map(a=>a.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function teacher(){return `<h1>Modo professor</h1><div class="notice">Modo local de sala de aula: monte uma partida e projete em um dispositivo. Não é uma sala multiplayer online; não coleta respostas de outros dispositivos. O histórico fica neste navegador.</div><div class="teacher-grid"><section class="panel"><h2>Montar partida</h2><form id="teacher-form" class="stack"><label>Banco de questões <select id="teacher-topic"><option value="all">Todos os temas</option>${[...new Set([...QUESTIONS,...ETHICS,...ESCAPE,...CAVE,...custom].map(q=>q.topic))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><div id="teacher-questions" class="list"></div><button class="primary">Começar partida selecionada</button><p id="teacher-msg" role="status"></p></form></section><section class="panel"><h2>Questão autoral</h2><form id="custom" class="stack"><label>Tema<input id="ct" required maxlength="60"></label><label>Enunciado<textarea id="cp" required maxlength="600"></textarea></label>${[0,1,2,3].map(i=>`<label>Alternativa ${'ABCD'[i]}<input id="ca${i}" required maxlength="350"></label>`).join('')}<label>Correta<select id="cc">${[0,1,2,3].map(i=>`<option value="${i}">${'ABCD'[i]}</option>`).join('')}</select></label><label>Explicação<textarea id="cw" required maxlength="800"></textarea></label><label>Apoio de leitura<textarea id="ch" maxlength="350"></textarea></label><button>Salvar questão local</button></form><hr><button id="csv">Exportar resultados</button></section></div>`}function bindTeacher(){const bank=[...QUESTIONS,...ETHICS,...ESCAPE,...CAVE,...custom];const update=()=>{$('#teacher-questions').innerHTML=bank.filter(q=>$('#teacher-topic').value==='all'||q.topic===$('#teacher-topic').value).map(q=>`<label><input type="checkbox" name="pick" value="${esc(q.id)}"> ${esc(q.prompt)}</label>`).join('')};$('#teacher-topic').onchange=update;update();$('#teacher-form').onsubmit=e=>{e.preventDefault();const ids=[...document.querySelectorAll('input[name=pick]:checked')].map(x=>x.value),items=bank.filter(q=>ids.includes(q.id));if(!items.length){$('#teacher-msg').textContent='Marque ao menos uma pergunta.';return}startGame('teacher',items)};$('#custom').onsubmit=e=>{e.preventDefault();const v=id=>$('#'+id).value.trim();const q=Q('custom-'+Date.now(),v('ct'),'Autoral',v('cp'),[0,1,2,3].map(i=>v('ca'+i)),Number(v('cc')),v('cw'),v('ch')||'Leia os argumentos com atenção.');if([q.topic,q.prompt,...q.opts,q.why].some(x=>!x)){announce('Preencha todos os campos obrigatórios.');return}custom.push(q);save('fs2-custom',custom);render(false);announce('Questão adicionada ao banco local.');$('#teacher-msg').textContent='Questão adicionada ao banco local.'}}
function libras(){return `<h1>Libras e acessibilidade</h1><div class="panel stack"><p>O FiloSinal foi pensado para a diversidade linguística. As atividades oferecem uma janela vertical para vídeos de interpretação em Libras.</p><h2>Como assistir</h2><p>Quando uma tradução estiver disponível, use os controles do vídeo para pausar, repetir ou ampliar a janela. Você pode ler o conteúdo em português escrito e jogar no seu próprio ritmo, sem cronômetro obrigatório.</p><p class="muted">Quando uma gravação ainda não estiver disponível, a janela informa sua ausência. Os vídeos são publicados pela equipe responsável pelo projeto após revisão.</p><h2>FiloSinal Translator — versão experimental</h2><p>Consulte o acervo de traduções do projeto. A reprodução é liberada apenas para gravações autorizadas e revisadas; um texto sem tradução cadastrada fica marcado como pendente. O módulo não gera sinalização automaticamente.</p><p><a href="./translator.html">Abrir FiloSinal Translator</a> · <a href="./videos-libras.html">Banco de vídeos de referência em Libras</a></p><h2>Tradução automática de orientações de navegação</h2><p>O VLibras é um serviço externo de tradução pontual. Disponibilizamos o recurso em uma página separada para auxiliar no acesso às orientações gerais do site; ele não substitui traduções humanas dos jogos.</p><p><a href="./acessibilidade.html">Abrir orientações de navegação com VLibras</a></p><button class="primary" data-go="games">Explorar jogos</button></div>`}
function about(){return `<h1>Sobre o FiloSinal</h1><div class="panel stack"><p>Projeto educacional dedicado à Filosofia, à argumentação e ao acesso linguístico. Recursos visuais, navegação por teclado, personalização da leitura e atividades sem tempo obrigatório são parte da proposta.</p><h2>Acessibilidade e limites</h2><p>O site foi construído com referência às <a href="https://www.w3.org/TR/WCAG22/">WCAG 2.2</a>. Não é certificado: faltam avaliação com usuários surdos e tradução humana revisada. Os espaços de Libras são identificados quando não há vídeo. O texto em português permanece disponível como alternativa. O <a href="./translator.html">FiloSinal Translator</a> é um acervo experimental de traduções revisadas, com consulta local. Ainda não gera traduções automáticas. O <a href="./acessibilidade.html">VLibras</a> está disponível apenas para a tradução pontual das orientações de navegação, não do conteúdo pedagógico.</p><h2>Referências para estudo</h2><ul>${PEOPLE.map(p=>`<li>${esc(p[1])}. <cite>${esc(p[5])}</cite>.</li>`).join('')}<li>GETTIER, Edmund. Is Justified True Belief Knowledge? 1963.</li><li>POPPER, Karl. A lógica da pesquisa científica.</li><li><a href="https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14191.htm">Lei 14.191/2021 — educação bilíngue de surdos</a>.</li><li><a href="https://plato.stanford.edu/">Stanford Encyclopedia of Philosophy</a>.</li></ul><h2>Privacidade</h2><p>Não há login nem coleta de dados no servidor nesta versão. A página separada de orientações com VLibras pode se conectar ao serviço externo, sujeito a seus <a href="https://www.vlibras.gov.br/privacy.html">termos e aviso de privacidade</a>. Progresso e preferências são guardados no navegador, sujeitos à limpeza e às limitações do dispositivo. As traduções publicadas são acessíveis a todos; apenas contas autorizadas a escrever no repositório podem modificar os arquivos publicados.</p></div>`}
function render(focus=true){clipToken++;document.querySelectorAll('nav [data-go]').forEach(b=>{if(b.dataset.go===page||b.dataset.go==='games'&&['play','setup'].includes(page))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});let html='';switch(page){case'home':html=home();break;case'games':html='<h1>Jogos filosóficos</h1><p class="muted">Escolha sua experiência. Aprenda sem pressa.</p>'+gameCards();break;case'setup':html=questionsSetup();break;case'play':html=session.complete?result():session.kind==='memory'?memory():session.kind==='timeline'?timeline():quiz();break;case'library':html=library();break;case'glossary':html=glossary();break;case'progress':html=progressPage();break;case'teacher':html=teacher();break;case'libras':html=libras();break;case'about':html=about();break;default:html=detailsPage()};main.innerHTML=html;bindClip();if(page==='setup')bindSetup();if(page==='play'&&!session.complete){if(session.kind==='memory')bindMemory();else if(session.kind==='timeline')bindTimeline();else bindQuiz()}if(['library','glossary'].includes(page))bindCollection(page);if(page==='teacher')bindTeacher();if($('#csv'))$('#csv').onclick=csv;if(focus)focusMain()}
applyPrefs();render(false);if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
